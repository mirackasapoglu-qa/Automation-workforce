<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- Sayfa /scope adresinden de servis edilebiliyor; base olmadan goreli
     yollar (style.css, js/app.js) panelin KOKUNE gidiyor ve 404 oluyor. -->
<base href="/scope/">
<title>Kapsam Agaci — Flowscope</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="style.css">
<!-- Tema secimi panelle PAYLASILIR: ayni origin, ayni localStorage anahtari.
     Panelde koyuya gecince burasi da koyu acilir. -->
<script>
  (function () {
    try {
      var m = localStorage.getItem('qa-panel-theme');
      if (m) document.documentElement.setAttribute('data-theme', m);
    } catch (e) { /* depolama kapaliysa sistem tercihi gecerli */ }
  })();
</script>
</head>
<body>
<div class="fw" id="fw-root"></div>
<!-- Yazma uclari x-panel-token ister; sunucu bu yer tutucuyu doldurur. -->
<script>window.PANEL_TOKEN = "__PANEL_TOKEN__";</script>
<!-- Landing ayri bir surecte (4321). Bos gelirse ust bardaki dugme cikmaz. -->
<script>window.LANDING_URL = "__LANDING_URL__";</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
