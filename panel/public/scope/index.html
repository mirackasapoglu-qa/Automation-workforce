<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!-- Sayfa /scope adresinden de servis edilebiliyor; base olmadan goreli
     yollar (style.css, js/app.js) panelin KOKUNE gidiyor ve 404 oluyor. -->
<base href="/scope/">
<title>Kapsam Agaci — Flowscope</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="/theme.css">
<!-- Ortak ust bar. Mutlak yol: `base` bunu etkilemez. -->
<link rel="stylesheet" href="/nav.css">
<!-- Baglantilar (connectors) acilir paneli — panelle ORTAK dosya, mutlak yol. -->
<link rel="stylesheet" href="/connectors.css">
<link rel="stylesheet" href="style.css">
<!-- Tema secimi panelle PAYLASILIR: ayni origin, ayni localStorage anahtari.
     Panelde koyuya gecince burasi da koyu acilir. Bar da ayni anahtari yazar;
     bu blok yalnizca ILK BOYAMADAN ONCE calissin diye burada duruyor (bar
     body'de mount ediliyor, o ana kadar sayfa yanlis temada flash ederdi). -->
<script>
  (function () {
    try {
      var m = localStorage.getItem('qa-panel-theme');
      if (m) document.documentElement.setAttribute('data-theme', m);
    } catch (e) { /* depolama kapaliysa sistem tercihi gecerli */ }
  })();
</script>
</head>
<body>
<!-- Landing ayri bir surecte (4321). Bos gelirse bardaki dugme HIC basilmaz. -->
<script>window.HQ_NAV = __HQ_NAV__;</script>
<script src="/nav.js"></script>
<script>HqNav.mount({ surface: "scope", leaf: "Kapsam agaci" });</script>
<!-- Bardaki `connectors` dugmesinin icerigi: panelle ayni klasik script'ler.
     dialogs.js uiToast/uiConfirm verir (kart eylemleri bunlarla konusur);
     connectors.js /api/preflight'i okur, karti cizer, kurtarma yollarini baglar.
     app.js'ten ONCE: token'i window.PANEL_TOKEN'dan alir, o da hemen asagida. -->
<script>window.PANEL_TOKEN = "__PANEL_TOKEN__";</script>
<script src="/js/dialogs.js"></script>
<script src="/js/connectors.js"></script>

<div class="fw" id="fw-root"></div>
<!-- Yazma uclari x-panel-token ister; window.PANEL_TOKEN yukarida (bar script'lerinden once) set edildi. -->
<script type="module" src="./js/app.js"></script>
</body>
</html>
